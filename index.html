<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行业分析工作台 · Evidence-Graded Industry Analysis</title>
<style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }
:root {
  --bg: #f4f1e7;
  --card: #fffdf7;
  --ink: #2b2b26;
  --muted: #8a877a;
  --accent: #2f7d46;
  --accent2: #5aa469;
  --line: #e4dfd0;
  --code-bg: #f0ece0;
  --quote-bg: #f6f3e8;
  --danger: #c0392b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16161a;
    --card: #202024;
    --ink: #e6e6e0;
    --muted: #8f8f86;
    --accent: #5cb87a;
    --accent2: #81c784;
    --line: #333338;
    --code-bg: #2a2a2f;
    --quote-bg: #26262b;
    --danger: #e57373;
  }
}
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.65 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
}
.topbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 10px 18px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 1px 6px rgba(0,0,0,.05);
}
.brand { font-weight: 700; font-size: 16px; color: var(--accent); white-space: nowrap; }
.brand .sub { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 6px; }
.ctrl { display: flex; gap: 8px; align-items: center; flex: 1 1 360px; flex-wrap: wrap; }
#industryInput {
  flex: 1 1 200px; min-width: 170px;
  padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--ink); font-size: 14px;
}
#industryInput:focus { outline: 2px solid var(--accent2); outline-offset: 1px; }
.btn {
  padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--card); color: var(--ink); cursor: pointer;
  font-size: 13.5px; transition: .15s; font-family: inherit;
}
.btn:hover { border-color: var(--accent2); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.1); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.tokens {
  font-size: 12px; color: var(--muted); white-space: nowrap;
  font-variant-numeric: tabular-nums; margin-left: auto;
}
main { max-width: 880px; margin: 22px auto 90px; padding: 0 16px; display: flex; flex-direction: column; gap: 18px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 2px 10px rgba(0,0,0,.04); overflow: hidden;
  scroll-margin-top: 74px;
}
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px 0; flex-wrap: wrap; }
.card-head h2 { margin: 0; font-size: 16px; }
.status {
  display: flex; align-items: center; gap: 7px;
  font-size: 12.5px; color: var(--muted);
  padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line);
  white-space: nowrap;
}
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .85; flex: none; }
.status.running { color: var(--accent); border-color: var(--accent2); }
.status.running .dot { animation: blink 1s linear infinite; }
.status.done { color: #1e7a34; border-color: #a5d6a7; }
.status.error { color: var(--danger); border-color: var(--danger); }
@keyframes blink { 50% { opacity: .1; } }
.body { padding: 14px 18px 10px; overflow-wrap: break-word; }
.body > :first-child { margin-top: 0; }
.body h1, .body h2, .body h3, .body h4 { margin: 18px 0 8px; line-height: 1.3; }
.body h1 { font-size: 19px; } .body h2 { font-size: 17px; } .body h3 { font-size: 15.5px; } .body h4 { font-size: 14.5px; }
.body p { margin: 8px 0; }
.body ul, .body ol { margin: 8px 0; padding-left: 26px; }
.body li { margin: 4px 0; }
.body code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-family: Consolas, Menlo, monospace; font-size: 12.5px; }
.body pre { background: var(--code-bg); border: 1px solid var(--line); padding: 10px 12px; border-radius: 8px; overflow-x: auto; font-size: 12.5px; line-height: 1.5; }
.body pre code { background: none; padding: 0; }
.body blockquote {
  margin: 10px 0; padding: 8px 12px;
  border-left: 3px solid var(--accent2);
  background: var(--quote-bg);
  border-radius: 0 8px 8px 0;
}
.body blockquote p { margin: 4px 0; }
.body hr { border: none; border-top: 1px solid var(--line); margin: 14px 0; }
.body a { color: var(--accent); }
.body .table-wrap { overflow-x: auto; margin: 10px 0; border: 1px solid var(--line); border-radius: 8px; }
.body table { border-collapse: collapse; width: 100%; min-width: 480px; font-size: 13px; }
.body th, .body td { border: 1px solid var(--line); padding: 6px 9px; text-align: left; vertical-align: top; }
.body th { background: var(--code-bg); font-weight: 600; white-space: nowrap; }
.actions { padding: 0 18px 14px; display: flex; flex-direction: column; gap: 10px; }
.cand-box { display: flex; flex-direction: column; gap: 8px; }
.cand-hint { font-size: 12.5px; color: var(--muted); }
.cand-row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn.cand { background: var(--quote-bg); border-color: var(--accent2); max-width: 100%; }
.btn.cand:hover { background: var(--accent); color: #fff; }
.cand-input { width: 100%; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.retry-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.notice { font-size: 12.5px; color: var(--danger); }
.chat-input-row { padding: 10px 18px 16px; border-top: 1px dashed var(--line); }
.chat-input { width: 100%; padding: 10px 14px; border: 1px solid var(--accent2); border-radius: 10px; background: var(--bg); color: var(--ink); font-size: 14px; font-family: inherit; }
.chat-input:focus { outline: 2px solid var(--accent2); outline-offset: 1px; }
.chat-input:disabled { opacity: .5; }
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.35);
  display: flex; align-items: center; justify-content: center; z-index: 100;
}
.panel {
  width: min(480px, 92vw); background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 20px 22px; display: flex; flex-direction: column; gap: 12px;
  box-shadow: 0 10px 40px rgba(0,0,0,.2); max-height: 90vh; overflow-y: auto;
}
.panel h3 { margin: 0; }
.panel label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); }
.panel input[type=text], .panel input[type=password], .panel input[type=number], .panel select {
  padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--ink); font-size: 13.5px;
}
.panel .check { flex-direction: row; align-items: center; gap: 8px; }
.key-note { font-size: 11.5px; color: var(--muted); }
.panel-btns { display: flex; gap: 8px; justify-content: flex-end; }
.test-result { margin-top: 10px; white-space: pre-wrap; word-break: break-all; line-height: 1.5; }
.toast-wrap { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px;
  font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.25); animation: rise .2s ease;
}
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">行业分析工作台<span class="sub">五步证据链 · 直连 Claude API</span></div>
  <div class="ctrl">
    <input id="industryInput" type="text" placeholder="输入行业名称，如：体外诊断试剂">
    <button id="btnStart" class="btn primary">开始分析</button>
    <button id="btnStop" class="btn" disabled>停止</button>
    <button id="btnExport" class="btn">导出 .md</button>
    <button id="btnSettings" class="btn">⚙ 设置</button>
  </div>
  <div id="tokenUsage" class="tokens" title="累计 token 用量（输入 + 输出）">输入 0 · 输出 0</div>
</header>

<main id="main"></main>

<div id="settingsOverlay" class="overlay" hidden>
  <div class="panel">
    <h3>⚙ 设置</h3>
    <label>API 地址<input id="setBase" type="text" placeholder="https://api.anthropic.com"></label>
    <label>API Key<input id="setKey" type="password" placeholder="sk-ant-… / sk-…" autocomplete="off"></label>
    <div class="key-note">Key 仅保存在本机浏览器（localStorage），只会随请求发送到你填写的 API 地址。</div>
    <label>模型<input id="setModel" type="text" list="modelList" placeholder="claude-opus-5"></label>
    <datalist id="modelList">
      <option value="claude-opus-5">
      <option value="claude-sonnet-4-5">
      <option value="claude-haiku-4-5">
      <option value="anthropic/claude-opus-5">
      <option value="anthropic/claude-sonnet-4-5">
      <option value="anthropic/claude-haiku-4-5">
      <option value="anthropic/claude-sonnet-4.5">
      <option value="anthropic/claude-haiku-4.5">
      <option value="anthropic/claude-3-5-haiku-20241022">
      <option value="deepseek-chat">
      <option value="deepseek-reasoner">
    </datalist>
    <label>认证方式<select id="setAuth">
      <option value="auto">自动（Anthropic 官方 x-api-key / 其余 Bearer）</option>
      <option value="x-api-key">强制 x-api-key</option>
      <option value="bearer">强制 Authorization: Bearer</option>
    </select></label>
    <label>API 协议<select id="setProtocol">
      <option value="auto">自动检测（deepseek.com → OpenAI 兼容）</option>
      <option value="anthropic">Anthropic Messages（Claude 官方 / 兼容网关）</option>
      <option value="openai">OpenAI 兼容（DeepSeek 等）</option>
    </select></label>
    <div id="setProtocolNote" class="key-note"></div>
    <label class="check"><input type="checkbox" id="setWeb"> 联网核实（web_search 工具，最大 12 次）</label>
    <div id="setWebNote" class="key-note" hidden>OpenAI 兼容协议（DeepSeek 原生 API）不提供服务端 web_search 检索：联网核实将被忽略，系统 prompt 会自动把 A 档降级为 B 档并注明"凭记忆，未核实"。</div>
    <label>max_tokens<input id="setMax" type="number" min="1" step="1" value="64000"></label>
    <div class="key-note">Anthropic 默认 64000；OpenAI 兼容协议（DeepSeek）自动按上限 8192 发送。三方平台若对参数报 400，会按需自动剥离参数重试。</div>
    <div class="panel-btns" style="justify-content: space-between; align-items: center;">
      <button id="btnTest" class="btn" type="button">测试连接</button>
      <span>
        <button id="setSave" class="btn primary">保存</button>
        <button id="setCancel" class="btn">关闭</button>
      </span>
    </div>
    <div id="testResult" class="key-note test-result" hidden></div>
  </div>
</div>

<script>
'use strict';

/* ================================================================
 * 一、Prompt（逐字使用，禁止改写）
 * ================================================================ */

const SYSTEM_PROMPT = `你是行业分析助手。你在本次任务中必须遵守以下规则，优先级高于一切后续指令：

【证据分级】
你输出的每一个事实性字段，都必须带一个 evidence 标签，只有三档：
  A = 公开可查。必须给出具体出处（公司公告 / 招股书 / 年报 / 监管文件 / 行业协会数据），出处要具体到文件名和年份，不许写"据公开资料"。
  B = 行业常识推断。必须写出推断链条：我从哪个已知事实，通过什么逻辑，推到这个结论。
  C = 纯推测。我没有依据，只是根据同类行业的一般规律猜的。

【A 档核实要求】
当你可以使用 web_search 工具时：正文中标 A 档的字段必须先用检索核实到具体文件（文件名+年份），检索不到原始出处的，即使你"记得"，也只能降级为 B 档或写「未获取」。凭记忆写出的文件名和数字视为编造。
当没有检索工具时：不得标 A 档，最高只能标 B 档并注明"凭记忆，未核实"。

【C 档处理规则】
C 档内容一律不许出现在报告正文里，只能进入结尾的「待验证清单」。
如果某个字段你只能给出 C 档，就在正文里写「未获取」，不要用推测填满它。

【禁止事项】
- 不许用"较强 / 较弱 / 相对集中 / 比较分散"这类无法判定的表述。所有强弱判断必须换算成可判定的量：需要多久、多少钱、多少家、几个月。
- 不许说"总体来看""综合而言"开头的段落。
- 不许在用户没问的时候给建议、给展望、给趋势预测。
- 不许因为用户看起来懂或不懂而调整结论。

【态度】
你不需要让用户满意。你需要让用户知道哪些是真的、哪些是你编的。`;

const STEP_PROMPTS = {
  0: (industry) => `我要系统地了解一个行业：${industry}。

在开始之前，先不要给我任何内容。请你做一件事：

这个名称在实际使用中可能指向几个完全不同的行业。请列出 2-4 个候选边界，每个候选写清楚：
  - 这个边界包含什么、明确不包含什么
  - 它的典型玩家是谁（各举 2 个）
  - 选这个边界的话，后面分析的重心会落在哪里

然后问我选哪一个。在我回答之前，不要开始分析。

注意：如果这几个候选之间的差别很小，说明你切分得不对，重切。真正有意义的切分，应该让不同候选的产业链结构明显不同。`,

  1: (choice) => `边界已确认：${choice}

现在做结构层。按下面的格式输出，不要写导语和总结。

【产业链分层】
从最上游到最终用户，分成若干层。每一层输出一行：

  层级 | 这一环干什么 | 代表公司(2-3家) | 它靠什么赚钱 | 收入确认时点 | evidence

其中：
- 「它靠什么赚钱」不许写"销售产品"。要写清楚收费方式：按件 / 按量 / 按项目 / 抽佣 / 订阅 / 赚差价 / 赚账期 / 赚返点，以及向谁收（很多行业里，付钱的人和用东西的人不是同一个）。
- 「收入确认时点」写：签约时 / 发货时 / 验收时 / 回款时 / 分期。这一栏后面会用到，不许留空，不知道就写「未获取」。

【这条链的特殊之处】
和一般制造业/服务业的标准链条比，这条链多了哪一环、少了哪一环、或者哪一环的位置不一样？只写差异，不写共性。

【我可能画错的地方】
你在分层时做了哪 3 个判断是可能错的？逐条列出。`,

  2: () => `基于上面的产业链，现在拆三条流转链。三条分开输出，不要合并。

【钱流】
从最终用户付出的 100 元开始，追踪它依次经过哪些环节。每一跳一行：

  从谁 → 到谁 | 这一跳留下多少(%) | 账期多长 | 谁先垫钱 | evidence

  账期和垫资这两栏是重点。如果不知道，写「未获取」并列入待验证清单，绝对不许用行业平均值或者常识填充。

【货流 / 服务交付流】
东西（或服务）实际怎么从生产端到达用户端。每一跳一行：

  从哪 → 到哪 | 谁掌握控制权 | 谁承担损耗和退货 | 时间多久 | evidence

  注意：货流和钱流的路径经常不一致（比如经销商不碰货只走账，或者平台碰货不碰账）。如果这条链和钱流路径不同，明确指出不同在哪。

【用户流】
用户是怎么被找到、被转化、被留住的。

  获客渠道 | 决策者是谁 | 付钱的是谁 | 使用的是谁 | 复购触发条件 | evidence

  「决策者 / 付钱的 / 使用的」三者是否分离，是这个行业的一个关键特征，必须明确回答是或否。

【三条链的错位】
三条链在哪一环出现了错位（控制权、资金、使用权不在同一方手里）？错位的地方通常就是这个行业的矛盾和机会所在，逐条指出。`,

  3: () => `现在分析议价能力。

严格禁止使用以下表述：议价能力较强 / 较弱 / 相对集中 / 比较分散 / 处于优势地位 / 话语权较大。这些说法对任何行业都成立，等于没说。

对下面五个问题逐一作答，每个问题的答案必须是一个可以被验证的量。

1. 供应商议价
   问：如果现在要换掉这条链上最大的那个供应商，需要多久？成本上升多少？有几家可替代的？换供应商需要重新认证/备案吗？
   → 答案里必须出现具体的时间或金额。答不出来写「未获取」。

2. 客户议价
   问：客户从这一环切换到竞争对手，具体要付出什么代价？（合同违约金 / 数据迁移 / 重新培训 / 库存作废 / 关系重建 / 无代价）
   → 如果答案是"基本无代价"，那这一环的议价权就是零，直接这么写。

3. 替代品威胁
   问：这个行业的需求，上一次被另一种形态吃掉是什么时候？吃掉了多少？现在有没有正在发生的同类事情？
   → 要具体事件，不要"随着技术发展可能被替代"这种话。

4. 新进入者
   问：挡住新人的到底是什么？在下面几项里点名，不许全选：
   牌照/资质 | 起步资本量 | 渠道关系 | 手艺和经验 | 数据积累 | 规模成本 | 品牌信任 | 几乎没有壁垒
   → 点名之后回答：一个有钱有人的新玩家，从零到能接单要多久？

5. 同业竞争
   问：现有玩家是在同一个维度上打，还是分层错开？最近三年发生过几次价格战？由谁发起？结果如何？
   → 如果分层，说明分层的依据是什么（客户规模/地域/品类/服务深度）。

【综合结论】
在这条产业链上，利润最终沉淀在哪一环？为什么是这一环而不是别的？用上面五个答案来论证，不许引入新的理由。

【最脆弱的一环】
哪一环的议价权最容易在未来两年内被削弱？触发条件是什么？标注 evidence，如果是 C 档就明说这是推测。`,

  4: () => `最后一层。注意：这一层的规则和前面三层完全不同。

这三类信息在公开资料里极少存在，你大概率不知道。因此本步骤中：
- 你不许输出结论
- 你只许输出「我猜是这样」+「怎么验证」+「该问谁」
- 每一条都默认是 C 档，不需要标 evidence，但必须写清楚验证方法

【约束｜这个行业不能做的事】
分三类，每类给 3-5 条假设：
  法规约束：牌照、审批、准入、强制标准、监管红线
  物理约束：保质期、温控、运输半径、产能爬坡时间、设备切换成本
  习惯约束：账期惯例、返点潜规则、渠道保护、不能越过的关系

  格式：假设 | 如果这条成立会导致什么 | 怎么验证 | 该问谁

/* ================================================================
 * 四、轻量 Markdown 渲染器（先转义，再处理；流式 rAF 节流）
 * ================================================================ */

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function inlineFormat(s) {
  let out = escapeHtml(s);
  out = out.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  out = out.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return out;
}

function splitCells(row) {
  let s = String(row).trim();
  if (s.startsWith('|')) s = s.slice(1);
  if (s.endsWith('|')) s = s.slice(0, -1);
  return s.split('|').map((c) => c.trim());
}

function isSepRow(line) {
  const cells = splitCells(line);
  return cells.length >= 1 && cells.every((c) => /^:?-{3,}:?$/.test(c));
}

function parseMd(md) {
  if (!md) return '';
  const lines = String(md).replace(/\r\n/g, '\n').split('\n');
  let html = '';
  let i = 0;
  const n = lines.length;
  const para = [];
  const flushPara = () => {
    if (para.length) { html += '<p>' + para.map(inlineFormat).join('<br>') + '</p>'; para.length = 0; }
  };
  while (i < n) {
    const raw = lines[i];
    const t = raw.trim();
    /* 围栏代码块 */
    if (/^```/.test(t)) {
      flushPara();
      const lang = t.slice(3).trim();
      const code = [];
      i++;
      while (i < n && !/^```/.test(lines[i].trim())) { code.push(lines[i]); i++; }
      if (i < n) i++;
      html += '<pre><code' + (lang ? ' class="lang-' + escapeHtml(lang) + '"' : '') + '>' + escapeHtml(code.join('\n')) + '</code></pre>';
      continue;
    }
    /* 标题 # ~ #### */
    const hm = t.match(/^(#{1,4})\s+(.+)$/);
    if (hm) {
      flushPara();
      html += '<h' + hm[1].length + '>' + inlineFormat(hm[2]) + '</h' + hm[1].length + '>';
      i++;
      continue;
    }
    /* 分割线 */
    if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(t)) {
      flushPara();
      html += '<hr>';
      i++;
      continue;
    }
    /* 引用 */
    if (t.startsWith('>')) {
      flushPara();
      const q = [];
      while (i < n && lines[i].trim().startsWith('>')) {
        q.push(lines[i].replace(/^>\s?/, ''));
        i++;
      }
      html += '<blockquote>' + q.map(inlineFormat).join('<br>') + '</blockquote>';
      continue;
    }
    /* 有序列表：保留原始序号，且容忍项之间的空行 */
    const om = t.match(/^(\d{1,4})[.、．)\]]\s+(.*)$/);
    if (om) {
      flushPara();
      html += '<ol>';
      while (i < n) {
        const lt = lines[i].trim();
        const mm = lt.match(/^(\d{1,4})[.、．)\]]\s+(.*)$/);
        if (mm) {
          html += '<li value="' + mm[1] + '">' + inlineFormat(mm[2]) + '</li>';
          i++;
        } else if (lt === '' && i + 1 < n && /^\d{1,4}[.、．)\]]\s+/.test(lines[i + 1].trim())) {
          i++; /* 跳过列表内部空行 */
        } else break;
      }
      html += '</ol>';
      continue;
    }
    /* 无序列表 */
    if (/^[-*+]\s+/.test(t)) {
      flushPara();
      html += '<ul>';
      while (i < n) {
        const lt = lines[i].trim();
        const mm = lt.match(/^[-*+]\s+(.*)$/);
        if (mm) {
          html += '<li>' + inlineFormat(mm[1]) + '</li>';
          i++;
        } else if (lt === '' && i + 1 < n && /^[-*+]\s+/.test(lines[i + 1].trim())) {
          i++;
        } else break;
      }
      html += '</ul>';
      continue;
    }
    /* 表格 */
    if (t.startsWith('|')) {
      const rows = [];
      let j = i;
      while (j < n && lines[j].trim().startsWith('|')) { rows.push(lines[j].trim()); j++; }
      let sep = -1;
      for (let k = 1; k < rows.length; k++) { if (isSepRow(rows[k])) { sep = k; break; } }
      if (sep > 0) {
        flushPara();
        const headCells = splitCells(rows[0]);
        html += '<div class="table-wrap"><table><thead><tr>';
        for (const c of headCells) html += '<th>' + inlineFormat(c) + '</th>';
        html += '</tr></thead><tbody>';
        for (let k = sep + 1; k < rows.length; k++) {
          const cells = splitCells(rows[k]);
          html += '<tr>';
          for (let c = 0; c < headCells.length; c++) {
            html += '<td>' + inlineFormat(cells[c] !== undefined ? cells[c] : '') + '</td>';
          }
          html += '</tr>';
        }
        html += '</tbody></table></div>';
        i = j;
        continue;
      }
      para.push(t);
      i++;
      continue;
    }
    /* 空行 */
    if (t === '') { flushPara(); i++; continue; }
    /* 普通段落 */
    para.push(t);
    i++;
  }
  flushPara();
  return html;
}

const pendingRenders = new Set();
function scheduleRender(n) {
  if (pendingRenders.has(n)) return;
  pendingRenders.add(n);
  requestAnimationFrame(() => {
    pendingRenders.delete(n);
    const sec = sections[n];
    if (!sec || !sec.card) return;
    const bodyEl = sec.card.querySelector('.body');

}

function deepCopy(o) {
  if (typeof structuredClone === 'function') {
    try { return structuredClone(o); } catch (e) { /* fallthrough */ }
  }
  return JSON.parse(JSON.stringify(o));
}

function abortError() {
  try { return new DOMException('Aborted', 'AbortError'); }
  catch (e) { const err = new Error('Aborted'); err.name = 'AbortError'; return err; }
}
function isAbort(e) { return e && e.name === 'AbortError'; }

function sleep(ms, signal) {
  return new Promise((resolve, reject) => {
    if (signal && signal.aborted) { reject(abortError()); return; }
    const timer = setTimeout(done, ms);
    function done() { cleanup(); resolve(); }
    function onAbort() { clearTimeout(timer); cleanup(); reject(abortError()); }
    function cleanup() { if (signal) signal.removeEventListener('abort', onAbort); }
    if (signal) signal.addEventListener('abort', onAbort, { once: true });
  });
}

function buildAuth(s, official) {
  const useX = s.auth === 'x-api-key' || (s.auth === 'auto' && official);
  return useX ? { 'x-api-key': s.key } : { 'authorization': 'Bearer ' + s.key };
}
function buildHeaders(s, official) {
  const h = Object.assign({ 'content-type': 'application/json', 'anthropic-version': '2023-06-01' }, buildAuth(s, official));
  if (official) {
    h['anthropic-dangerous-direct-browser-access'] = 'true';
    h['anthropic-beta'] = 'server-side-fallback-2026-07-01';
  }

}
function buildOpenAIHeaders(s) {
  return Object.assign({ 'content-type': 'application/json' }, buildAuth(s, false));
}

function buildBody(s, messages, stripped, official) {
  const body = {
    model: s.model,
    max_tokens: Math.max(1, Number(s.maxTokens) || 64000),
    stream: true,
    system: stripped.cache ? SYSTEM_PROMPT : [{ type: 'text', text: SYSTEM_PROMPT, cache_control: { type: 'ephemeral' } }],
    messages: messages
  };
  if (s.web && !stripped.tools) body.tools = [{ type: 'web_search_20260209', name: 'web_search', max_uses: 12 }];
  if (official && !stripped.fallbacks) body.fallbacks = 'default';
  return body;
}

async function readErrText(resp) {
  try {
    const txt = await resp.text();
    try {
      const j = JSON.parse(txt);
      if (j && j.error) return (j.error.message || txt);
    } catch (e) { /* not json */ }
    return txt;
  } catch (e) { return 'HTTP ' + resp.status; }
}

/* 400 参数剥离：每个参数最多剥一次 */
function stripParam(txt, stripped) {
  if (!stripped.fallbacks && /fallback/i.test(txt)) return 'fallbacks';
  if (!stripped.cache && /cache_control|ephemeral/i.test(txt)) return 'cache';
  if (!stripped.tools && /web_search|tools|tool/i.test(txt)) return 'tools';
  return null;
}

function concatBytes(chunks) {
  const total = chunks.reduce((a, c) => a + c.length, 0);
  const out = new Uint8Array(total);
  let off = 0;
  for (const c of chunks) { out.set(c, off); off += c.length; }
  return out;
}

function finalizeBlocks(blocks) {
  for (const b of blocks) {
    if (!b) continue;
    if ((b.type === 'tool_use' || b.type === 'server_tool_use') && b.partial_json !== undefined) {
      try { b.input = JSON.parse(b.partial_json); } catch (e) { b.input = {}; }
      delete b.partial_json;
    }
  }
}

function handleEvent(ev, ctx, cb) {
  switch (ev.type) {
    case 'message_start': {
      const u = (ev.message && ev.message.usage) || {};
      const input = (u.input_tokens || 0) + (u.cache_creation_input_tokens || 0) + (u.cache_read_input_tokens || 0);
      ctx.lastOutput = 0;
      if (cb.onUsage) cb.onUsage({ input: input, output: 0 });
      break;
    }
    case 'content_block_start': {
      const i = ev.index;
      while (ctx.blocks.length <= i) ctx.blocks.push(null);
      const blk = deepCopy(ev.content_block);
      ctx.blocks[i] = blk;
      ctx.startedBlocks++;
      if (blk.type === 'server_tool_use' || (blk.type === 'tool_use' && blk.name === 'web_search')) {
        if (cb.onToolStart) cb.onToolStart(blk);
      }
      break;
    }
    case 'content_block_delta': {
      const blk = ctx.blocks[ev.index];
      if (!blk) break;
      const d = ev.delta || {};
      if (d.type === 'text_delta') { blk.text = (blk.text || '') + d.text; if (cb.onText) cb.onText(d.text); }
      else if (d.type === 'thinking_delta') { blk.thinking = (blk.thinking || '') + d.thinking; }
      else if (d.type === 'signature_delta') { blk.signature = (blk.signature || '') + d.signature; }
      else if (d.type === 'input_json_delta') { blk.partial_json = (blk.partial_json || '') + d.partial_json; }
      break;
    }
    case 'content_block_stop': {
      const blk = ctx.blocks[ev.index];
      if (!blk) break;
      if (blk.type === 'tool_use' || blk.type === 'server_tool_use') {
        if (blk.partial_json !== undefined) {
          try { blk.input = JSON.parse(blk.partial_json); } catch (e) { blk.input = {}; }
          delete blk.partial_json;
        }
        if (cb.onToolEnd) cb.onToolEnd();
      }
      ctx.stoppedBlocks++;
      break;
    }
    case 'message_delta': {
      const u = ev.usage || {};
      const out = u.output_tokens || 0;
      const dOut = Math.max(0, out - (ctx.lastOutput || 0));
      ctx.lastOutput = out;
      if (cb.onUsage) cb.onUsage({ input: 0, output: dOut });
      if (ev.delta && ev.delta.stop_reason) {
        ctx.stopReason = ev.delta.stop_reason;
        if (cb.onStopReason) cb.onStopReason(ev.delta.stop_reason);
      }
      break;
    }
    case 'message_stop': ctx.sawStop = true; break;
    case 'ping': break;
    case 'error': {
      const msg = (ev.error && ev.error.message) || '未知流错误';
      const err = new Error('流内错误：' + msg);
      err.retryable = true;
      throw err;
    }

  }

/* 单条 SSE data 载荷：多行 data: 拼接后再解析（兼容网关分片/换行）；[DONE] 视为流结束 */
function dispatchEventData(data, ctx, cb) {
  if (!data) return;
  if (data === '[DONE]') { ctx.sawDone = true; return; }
  let ev;
  try { ev = JSON.parse(data); } catch (e) { return; }
  handleEvent(ev, ctx, cb);
}

async function readSSE(resp, ctx, cb) {
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  const chunks = [];
  let buf = '';
  try {
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      buf += dec.decode(value, { stream: true });
      let m;
      while ((m = buf.match(/(\r?\n\r?\n)/)) !== null) {
        const raw = buf.slice(0, m.index);
        buf = buf.slice(m.index + m[0].length);
        const dataLines = [];
        for (const ln of raw.split(/\r?\n/)) {
          const t = ln.trim();
          if (t.startsWith('data:')) dataLines.push(t.slice(5).trim());
        }
        dispatchEventData(dataLines.join('\n'), ctx, cb);
      }
    }
    if (buf.trim()) {
      const dataLines = [];
      for (const ln of buf.split(/\r?\n/)) {
        const t = ln.trim();
        if (t.startsWith('data:')) dataLines.push(t.slice(5).trim());
      }
      dispatchEventData(dataLines.join('\n'), ctx, cb);
    }
  } finally {
    ctx.fullText = new TextDecoder().decode(concatBytes(chunks));
    try { await reader.cancel(); } catch (e) { /* ignore */ }
  }
}

/* 兜底：个别三方网关忽略 stream:true 直接返回整段 JSON（可能还包在 SSE data: 帧里，或 content 为纯文本） */
function tryParseBuffered(ctx) {
  if (!ctx.fullText) return null;
  const cleaned = String(ctx.fullText).replace(/^\s*data:\s*/gm, '').trim();
  let j;
  try { j = JSON.parse(cleaned); } catch (e) { return null; }
  const msg = (j && j.message && typeof j.message === 'object') ? j.message : j;
  const content = msg && msg.content;
  const stopReason = j.stop_reason || (msg && msg.stop_reason) || 'end_turn';
  if (Array.isArray(content)) {
    const blocks = content.map((b) => (b && typeof b === 'object' ? deepCopy(b) : { type: 'text', text: String(b) }));
    return { blocks: blocks, stopReason: stopReason };
  }
  if (typeof content === 'string' && content.trim()) {
    return { blocks: [{ type: 'text', text: content }], stopReason: stopReason };
  }
  return null;
}

/* 网关以 HTTP 200 包装的 JSON 错误对象（无 content）→ 提取 message 供直接展示 */
function parseGatewayError(raw) {
  if (!raw) return null;
  const cleaned = String(raw).replace(/^\s*data:\s*/gm, '').trim();
  let j;
  try { j = JSON.parse(cleaned); } catch (e) { return null; }
  if (j && j.error) {
    const m = j.error.message || j.error.type || j.error;
    return String(typeof m === 'string' ? m : JSON.stringify(m)).slice(0, 300);
  }
  return null;
}

function retryWait(attempt, signal, fixed) {
  const ms = fixed != null ? fixed : (attempt === 0 ? 2500 : 5000);
  return sleep(ms, signal);
}

/* 核心：发送一轮消息，返回 { blocks, stopReason }。

/* 已剥离参数按端点缓存：三方网关不支持的参数，后续步骤不再反复触发 400 */
let strippedCache = null; // { endpoint, flags }

async function sendAnthropic({ messages, signal, onText, onToolStart, onToolEnd, onUsage, onStopReason, onRewind, onNotice }) {
  const official = isOfficial(settings.base);
  const base = cleanBase(settings.base);
  const url = messagesUrl(base);
  const stripped = (strippedCache && strippedCache.endpoint === url)
    ? Object.assign({}, strippedCache.flags)
    : { fallbacks: false, cache: false, tools: false };
  let attempt = 0;

  while (true) {
    const body = buildBody(settings, messages, stripped, official);
    const headers = buildHeaders(settings, official);
    let resp;
    try {
      resp = await fetch(url, { method: 'POST', headers: headers, body: JSON.stringify(body), signal: signal });
    } catch (e) {

      if (attempt < MAX_RETRIES) {
        if (onRewind) onRewind();
        await retryWait(attempt, signal);
        attempt++;
        continue;

      throw new Error('网络中断：' + e.message);
    }

    if (resp.status === 400) {
      const txt = await readErrText(resp);
      const hit = stripParam(txt, stripped);
      if (hit === 'fallbacks') { stripped.fallbacks = true; strippedCache = { endpoint: url, flags: Object.assign({}, stripped) }; if (onNotice) onNotice('网关不支持 fallbacks 参数，已剥离后重试'); continue; }
      if (hit === 'cache') { stripped.cache = true; strippedCache = { endpoint: url, flags: Object.assign({}, stripped) }; continue; }
      if (hit === 'tools') { stripped.tools = true; strippedCache = { endpoint: url, flags: Object.assign({}, stripped) }; if (onNotice) onNotice('该平台不支持检索工具，已降级（本步不再有 A 档）'); continue; }
      throw new Error('请求被拒绝（HTTP 400）：' + txt.slice(0, 300));
    }
    if (RETRYABLE_STATUS.has(resp.status)) {
      if (attempt < MAX_RETRIES) {
        if (onRewind) onRewind();
        await retryWait(attempt, signal, resp.status === 429 ? 10000 : null);
        attempt++;
        continue;
      }
      throw new Error('服务暂时不可用（HTTP ' + resp.status + '）');
    }
    if (!resp.ok) {
      const txt = await readErrText(resp);
      throw new Error('请求失败（HTTP ' + resp.status + '）：' + txt.slice(0, 300));
    }
    if (!resp.body) {
      if (attempt < MAX_RETRIES) {
        if (onRewind) onRewind();
        await retryWait(attempt, signal);
        attempt++;
        continue;
      }
      throw new Error('响应没有可读取的流');
    }

    const ctx = { blocks: [], lastOutput: 0, stopReason: null, sawStop: false, sawDone: false, startedBlocks: 0, stoppedBlocks: 0, fullText: '' };
    try {
      await readSSE(resp, ctx, { onText: onText, onToolStart: onToolStart, onToolEnd: onToolEnd, onUsage: onUsage, onStopReason: onStopReason });
    } catch (e) {
      if (isAbort(e)) throw e;
      /* 流中途网络断开（reader.read 抛 TypeError）同样按断流回滚重试 */
      const midStreamRetryable = e.retryable || (e instanceof TypeError) || /network|fetch|load failed|failed to fetch/i.test(String(e.message));
      if (midStreamRetryable && attempt < MAX_RETRIES) {
        if (onRewind) onRewind();
        await retryWait(attempt, signal);
        attempt++;
        continue;
      }
      throw e;
    }

    /* 断流判定：
       1) 有完成信号（message_stop / stop_reason / 块全部闭合 / [DONE]）→ 正常完成
       2) 网关忽略 stream 直接返回整段 JSON → 兜底解析
       3) 流被掐断但已有正文 → 保留内容，按「流中断，内容保留」处理（不重试，避免网关确定性截断时白烧 token）
       4) 什么都没收到 → 回滚重试；耗尽后报错并附诊断信息 */
    const blocksComplete = ctx.startedBlocks > 0 && ctx.stoppedBlocks >= ctx.startedBlocks;
    const complete = ctx.sawStop || ctx.stopReason || ctx.sawDone || blocksComplete;
    if (!complete) {
      /* 兜底 1：网关忽略 stream 返回整段 JSON（含包在 SSE data: 帧里的） */
      const fb = tryParseBuffered(ctx);
      if (fb) { finalizeBlocks(fb.blocks); return { blocks: fb.blocks, stopReason: fb.stopReason }; }
      const gotLen = ctx.fullText ? ctx.fullText.length : 0;
      const snippet = String(ctx.fullText || '').replace(/\s+/g, ' ').trim().slice(0, 180);
      /* 兜底 2：HTTP 200 包装的 JSON 错误对象 → 直接展示网关原因，不重试 */
      const gwErr = parseGatewayError(ctx.fullText);
      if (gwErr) throw new Error('网关响应异常（未按流式返回内容）：' + gwErr);
      /* 兜底 3：响应是 HTML/错误页 → 直接失败，不重试 */
      if (/^\s*<(?:!doctype|html|head|body|error|h[1-6]|pre|div)/i.test(String(ctx.fullText || '').trim())) {
        const titleM = /<title[^>]*>([\s\S]*?)<\/title>/i.exec(String(ctx.fullText || ''));
        const title = titleM ? titleM[1].replace(/\s+/g, ' ').trim() : '';
        throw new Error('该地址返回的是网页（HTML，' + gotLen + ' 字符' + (title ? '，标题「' + title + '」' : '') + '）而非 API 流式响应。请确认「API 地址」填的是网关的 API 接口地址（提供 Anthropic Messages 的 /v1/messages 接口），而非其网页控制台地址。响应开头：' + (snippet || '（空）'));
      }
      /* 兜底 4：流被掐断但已有正文 → 保留内容 */
      const textBlocks = ctx.blocks.filter((b) => b && b.type === 'text' && b.text);
      if (textBlocks.length > 0) {
        return { blocks: textBlocks, stopReason: 'stream_cut' }; /* 截断保留：内容不全但可用 */
      }
      if (attempt < MAX_RETRIES) {
        if (onRewind) onRewind();
        await retryWait(attempt, signal);
        attempt++;
        continue;
      }
      const openaiHint = /"choices"|finish_reason|"delta"/.test(String(ctx.fullText || ''));
      throw new Error('流意外中断，未收到完成信号（已接收 ' + ctx.startedBlocks + ' 个内容块 / ' + gotLen + ' 字符）' + (openaiHint ? '；响应疑似 OpenAI 兼容格式，当前仅支持 Anthropic Messages 协议' : '') + '；响应开头：' + (snippet ? snippet + '…' : '（空响应）'));
    }

    finalizeBlocks(ctx.blocks);
    const truncated = ctx.sawDone && !blocksComplete && !ctx.stopReason;
    return { blocks: ctx.blocks.filter(Boolean), stopReason: ctx.stopReason || (truncated ? 'stream_cut' : null) };
  }
}

/* ---------------- OpenAI 兼容协议（DeepSeek 等）：/chat/completions ---------------- */

/* 把会话历史转成 OpenAI 格式：system 前置；assistant 的 blocks 只保留 text 部分 */
function toOpenAIMessages(session) {
  const out = [{ role: 'system', content: SYSTEM_PROMPT }];
  for (const m of session) {
    if (m.role === 'user') {
      let content = m.content;
      if (Array.isArray(content)) content = content.map((b) => (b && b.text) || '').join('\n');
      out.push({ role: 'user', content: String(content || '') });
    } else if (m.role === 'assistant') {
      const parts = Array.isArray(m.content) ? m.content : [];
      const text = parts.filter((b) => b && b.type === 'text').map((b) => b.text || '').join('\n');
      if (text.trim()) out.push({ role: 'assistant', content: text });
    }
  }
  return out;
}

function handleOpenAIChunk(payload, ctx, cb) {
  if (payload === '[DONE]') { ctx.sawDone = true; return; }
  let ev;
  try { ev = JSON.parse(payload); } catch (e) { return; }
  const choice = ev.choices && ev.choices[0];
  if (choice) {
    const delta = choice.delta || {};
    if (typeof delta.content === 'string' && delta.content) {
      ctx.text += delta.content;
      if (cb.onText) cb.onText(delta.content);
    }
    if (choice.finish_reason) {
      const fr = choice.finish_reason;
      ctx.stopReason = fr === 'stop' ? 'end_turn' : (fr === 'length' ? 'max_tokens' : (fr === 'content_filter' ? 'refusal' : 'end_turn'));
      if (cb.onStopReason) cb.onStopReason(ctx.stopReason);
    }
  }
  if (ev.usage) {
    const u = ev.usage;
    const input = ((u.prompt_cache_hit_tokens || 0) + (u.prompt_cache_miss_tokens || 0)) || u.prompt_tokens || 0;
    const out = u.completion_tokens || 0;
    const dOut = Math.max(0, out - (ctx.lastOut || 0));
    ctx.lastOut = out;
    if (cb.onUsage) cb.onUsage({ input: input, output: dOut });
  }
}

async function readOpenAISSE(resp, ctx, cb) {
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  const chunks = [];
  let buf = '';
  try {
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      buf += dec.decode(value, { stream: true });
      let m;
      while ((m = buf.match(/(\r?\n\r?\n)/)) !== null) {
        const raw = buf.slice(0, m.index);
        buf = buf.slice(m.index + m[0].length);
        const dataLines = [];
        for (const ln of raw.split(/\r?\n/)) {
          const t = ln.trim();
          if (t.startsWith('data:')) dataLines.push(t.slice(5).trim());
        }
        handleOpenAIChunk(dataLines.join('\n'), ctx, cb);
      }
    }
    if (buf.trim()) {
      const dataLines = [];
      for (const ln of buf.split(/\r?\n/)) {
        const t = ln.trim();
        if (t.startsWith('data:')) dataLines.push(t.slice(5).trim());
      }
      handleOpenAIChunk(dataLines.join('\n'), ctx, cb);
    }
  } finally {
    ctx.fullText = new TextDecoder().decode(concatBytes(chunks));
    try { await reader.cancel(); } catch (e) { /* ignore */ }
  }
}

/* 兜底：网关忽略 stream 直接返回整段 OpenAI JSON */
function tryParseBufferedOpenAI(ctx) {
  if (!ctx.fullText) return null;
  let j;
  try { j = JSON.parse(String(ctx.fullText).trim()); } catch (e) { return null; }
  const choice = j && j.choices && j.choices[0];
  if (!choice || !choice.message) return null;
  const text = typeof choice.message.content === 'string' ? choice.message.content : '';
  let sr = 'end_turn';
  if (choice.finish_reason === 'length') sr = 'max_tokens';
  else if (choice.finish_reason === 'content_filter') sr = 'refusal';
  return { blocks: text ? [{ type: 'text', text: text }] : [], stopReason: sr };
}

/* OpenAI 兼容请求：同样的断流重试/参数剥离骨架，SSE 为 choices/delta 格式 */
async function sendOpenAI({ messages, signal, onText, onUsage, onStopReason, onRewind, onNotice }) {
  const url = openaiUrl(settings.base);
  const stripped = { maxTokens: false };
  const maxTokens = Math.min(Math.max(1, Number(settings.maxTokens) || 64000), 8192); /* DeepSeek 上限 8192 */
  let attempt = 0;

  while (true) {
    const body = { model: settings.model, messages: toOpenAIMessages(messages), stream: true };
    if (!stripped.maxTokens) body.max_tokens = maxTokens;
    const headers = buildOpenAIHeaders(settings);
    let resp;
    try {
      resp = await fetch(url, { method: 'POST', headers: headers, body: JSON.stringify(body), signal: signal });
    } catch (e) {
      if (isAbort(e)) throw e;
      if (attempt < MAX_RETRIES) {
        if (onRewind) onRewind();
        await retryWait(attempt, signal);
        attempt++;
        continue;
      }
      throw new Error('网络中断：' + e.message);
    }
    if (resp.status === 400) {
      const txt = await readErrText(resp);
      if (!stripped.maxTokens && /max_tokens/i.test(txt)) {
        stripped.maxTokens = true;
        if (onNotice) onNotice('网关不接受 max_tokens 参数，已剥离重试');
        continue;
      }
      throw new Error('请求被拒绝（HTTP 400）：' + txt.slice(0, 300));
    }
    if (RETRYABLE_STATUS.has(resp.status)) {
      if (attempt < MAX_RETRIES) {
        if (onRewind) onRewind();
        await retryWait(attempt, signal, resp.status === 429 ? 10000 : null);
        attempt++;
        continue;
      }
      throw new Error('服务暂时不可用（HTTP ' + resp.status + '）');
    }
    if (!resp.ok) {
      const txt = await readErrText(resp);
      throw new Error('请求失败（HTTP ' + resp.status + '）：' + txt.slice(0, 300));
    }
    if (!resp.body) {
      if (attempt < MAX_RETRIES) {
        if (onRewind) onRewind();
        await retryWait(attempt, signal);
        attempt++;
        continue;
      }
      throw new Error('响应没有可读取的流');
    }

    const ctx = { text: '', stopReason: null, sawDone: false, lastOut: 0, fullText: '' };
    try {
      await readOpenAISSE(resp, ctx, { onText: onText, onUsage: onUsage, onStopReason: onStopReason });
    } catch (e) {
      if (isAbort(e)) throw e;
      const midStreamRetryable = e.retryable || (e instanceof TypeError) || /network|fetch|load failed|failed to fetch/i.test(String(e.message));
      if (midStreamRetryable && attempt < MAX_RETRIES) {
        if (onRewind) onRewind();
        await retryWait(attempt, signal);
        attempt++;
        continue;
      }
      throw e;
    }

    if (!ctx.sawDone && !ctx.stopReason) {
      const fb = tryParseBufferedOpenAI(ctx);
      if (fb) return fb;
      if (attempt < MAX_RETRIES) {
        if (onRewind) onRewind();
        await retryWait(attempt, signal);
        attempt++;
        continue;
      }
      throw new Error('流意外中断，未收到完成信号（' + (ctx.fullText ? ctx.fullText.length : 0) + ' 字符）');
    }
    return { blocks: ctx.text ? [{ type: 'text', text: ctx.text }] : [], stopReason: ctx.stopReason };
  }
}

/* 协议分发入口 */
async function sendMessages(opts) {
  if (effectiveProtocol() === 'openai') return sendOpenAI(opts);
  return sendAnthropic(opts);
}


/* ================================================================
 * 六、卡片与状态 UI
 * ================================================================ */

function ensureCard(n) {
  if (sections[n]) return sections[n];
  const card = document.createElement('article');
  card.className = 'card';
  card.id = 'card-' + n;
  card.innerHTML =
    '<header class="card-head"><h2>' + STEP_META[n].title + '</h2>' +
    '<div class="status idle"><span class="dot"></span>等待中</div></header>' +
    '<div class="body"></div><div class="actions"></div>' +
    (n === 5 ? '<div class="chat-input-row" hidden><input class="chat-input" type="text" placeholder=""></div>' : '');
  mainEl.appendChild(card);
  const sec = { n: n, card: card, rawText: '', toolCount: 0 };
  sections[n] = sec;
  card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  return sec;
}

function setStatus(n, text, cls) {
  const sec = sections[n];
  if (!sec || !sec.card) return;
  const el = sec.card.querySelector('.status');
  if (!el) return;
  el.className = 'status ' + (cls || 'idle');
  el.innerHTML = '<span class="dot"></span>' + escapeHtml(text);
}

function setStopEnabled(on) { $('btnStop').disabled = !on; }

function updateTokens() {
  $('tokenUsage').textContent = '输入 ' + state.tokens.in.toLocaleString() + ' · 输出 ' + state.tokens.out.toLocaleString();
}

function toast(msg) {
  let wrap = document.querySelector('.toast-wrap');
  if (!wrap) { wrap = document.createElement('div'); wrap.className = 'toast-wrap'; document.body.appendChild(wrap); }
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(() => t.remove(), 5000);
}

function clip(s, n) { return s.length > n ? s.slice(0, n) + '…' : s; }

/* ================================================================
 * 七、流水线：Step0 → 四步串行 → 断点续跑
 * ================================================================ */

function startAnalysis() {
  const industry = industryInput.value.trim();
  if (!industry) { industryInput.focus(); toast('请先输入行业名称'); return; }
  if (!settings.key) { openSettings(); toast('请先在设置中填写 API Key'); return; }
  if (currentAbort) { currentAbort.abort(); currentAbort = null; }

  state.gen++;
  state.industry = industry;
  state.choice = null;
  state.session.length = 0;
  state.tokens.in = 0; state.tokens.out = 0;
  state.chatRound = 0; state.chatBusy = false; state.chatDone = false;
  sections = {};
  mainEl.innerHTML = '';
  updateTokens();
  setStopEnabled(true);
  ensureCard(0);
  runStep(0);
}

function buildStepPrompt(n) {
  if (n === 0) return STEP_PROMPTS[0](state.industry);
  if (n === 1) return STEP_PROMPTS[1](state.choice || '你选定的边界');
  return STEP_PROMPTS[n]();
}

async function runStep(n) {
  const gen = state.gen;
  const sec = ensureCard(n);
  sec.rawText = '';
  sec.toolCount = 0;
  setStatus(n, '生成中…', 'running');
  const actions = sec.card.querySelector('.actions');
  actions.innerHTML = '';

  const preLen = state.session.length;
  state.session.push({ role: 'user', content: buildStepPrompt(n) });

  const ac = new AbortController();
  currentAbort = ac;
  setStopEnabled(true);

  let blocks = null;
  let stopReason = null;
  try {
    for (let cont = 0; cont <= MAX_PAUSE_CONT; cont++) {
      const snap = sec.rawText;
      const res = await sendMessages({
        messages: state.session,
        signal: ac.signal,
        onText: (t) => { sec.rawText += t; scheduleRender(n); },
        onToolStart: () => { sec.toolCount++; setStatus(n, '检索中…（第 ' + sec.toolCount + ' 次）', 'running'); },
        onToolEnd: () => { setStatus(n, '生成中…', 'running'); },
        onUsage: (u) => { state.tokens.in += u.input; state.tokens.out += u.output; updateTokens(); },
        onStopReason: (r) => { stopReason = r; },
        onRewind: () => { sec.rawText = snap; scheduleRender(n); },
        onNotice: (msg) => toast(msg)
      });
      if (gen !== state.gen) return; /* 新一轮分析已开始，本回合作废 */
      blocks = res.blocks;
      stopReason = res.stopReason;
      if (stopReason === 'pause_turn' && cont < MAX_PAUSE_CONT) {
        /* 把已组装的 assistant blocks 原样 push 进会话再续传（连续同角色消息 API 自动合并） */
        state.session.push({ role: 'assistant', content: blocks });
        continue;
      }
      break;
    }
  } catch (e) {
    if (gen !== state.gen) return;
    if (currentAbort === ac) currentAbort = null;
    setStopEnabled(false);
    state.session.length = preLen; /* 失败清理：弹出本轮 user 消息和半截 assistant 消息 */
    failStep(n, e.message, isAbort(e));
    return;
  }
  if (gen !== state.gen) return;
  if (currentAbort === ac) currentAbort = null;
  setStopEnabled(false);

  if (stopReason === 'refusal') {
    state.session.length = preLen;
    failStep(n, '被安全分类器拒绝', false);
    return;
  }
  if (stopReason === 'pause_turn') {
    state.session.length = preLen;
    failStep(n, '检索续传超过 10 次', false);
    return;
  }

  state.session.push({ role: 'assistant', content: blocks });
  let statusText = '完成 · 检索 ' + sec.toolCount + ' 次';
  if (stopReason === 'max_tokens') statusText += '（可能被截断）';
  else if (stopReason === 'stream_cut') statusText += '（流中断，内容保留）';
  setStatus(n, statusText, 'done');
  stepComplete(n);
}

function stepComplete(n) {
  if (n === 0) showCandidates();
  else if (n <= 3) runStep(n + 1);
  else if (n === 4) showStep5Entry();
}

function failStep(n, reason, stopped) {
  const sec = sections[n];
  if (!sec) return;
  setStatus(n, stopped ? '已停止' : '出错：' + reason, 'error');
  const actions = sec.card.querySelector('.actions');
  actions.innerHTML = '';
  const row = document.createElement('div');
  row.className = 'retry-row';
  if (!stopped) {
    const detail = document.createElement('div');
    detail.className = 'notice';
    detail.textContent = '出错原因：' + reason;
    row.appendChild(detail);
  }
  const b = document.createElement('button');
  b.className = 'btn primary';
  b.textContent = '重试本步并继续';
  b.onclick = () => retryStep(n);
  row.appendChild(b);
  actions.appendChild(row);
}

function retryStep(n) {
  const sec = sections[n];
  if (!sec) return;
  sec.rawText = '';          /* 清空该节正文 */
  scheduleRender(n);
  runStep(n);                /* 只重跑这一步，成功后自动继续 */
}

/* ---- Step 0 候选边界 ---- */

function extractCandidates(raw) {
  const lines = String(raw).split('\n');
  const HEADER_RE = [
    /^\s*(?:#{1,4}\s*)?\*{0,2}候选\s*[一二三四五六123456]+\s*(?:[：:、)）\s（(]|$)/,
    /^\s*[（(]\s*[一二三四五六1-6]\s*[)）]\s*(?:候选|边界|方案|行业)/,
    /^\s*[一二三四五六1-6]\s*[.、．)）]\s*(?:候选|边界|方案|行业)/
  ];
  const headers = [];
  lines.forEach((line, idx) => {
    const t = line.trim();
    if (HEADER_RE.some((re) => re.test(t))) headers.push(idx);
  });
  if (!headers.length) {
    lines.forEach((line, idx) => { if (/^\s*\*{1,2}候选/.test(line.trim())) headers.push(idx); });
  }
  const hs = headers.slice(0, 4);
  if (hs.length >= 2) {
    const out = [];
    hs.forEach((h, i) => {
      const end = i + 1 < hs.length ? hs[i + 1] : lines.length;
      const seg = lines.slice(h, end).join('\n').trim();
      const first = lines[h].replace(/^#+\s*/, '').replace(/^\*{1,2}|\*{1,2}$/g, '').trim();
      out.push({ label: clip(first || ('候选' + '一二三四'[i]), 26), text: seg.slice(0, 1200) });
    });
    return out;
  }
  return ['候选一', '候选二', '候选三', '候选四'].map((l) => ({ label: l, text: l }));
}

function showCandidates() {
  const sec = sections[0];
  if (!sec) return;
  const cands = extractCandidates(sec.rawText);
  const actions = sec.card.querySelector('.actions');
  actions.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'cand-box';

  const hint = document.createElement('div');
  hint.className = 'cand-hint';
  hint.textContent = '请选择边界：点击候选直接开始，或在下方输入自定义边界（支持交叉组合，如「候选一 + 候选三」），回车确认。';
  box.appendChild(hint);

  const row = document.createElement('div');
  row.className = 'cand-row';
  cands.forEach((c) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn cand';
    b.textContent = c.label;
    b.title = c.text;
    b.onclick = () => chooseBoundary(c.text);
    row.appendChild(b);
  });
  box.appendChild(row);

  const input = document.createElement('input');
  input.className = 'cand-input';
  input.placeholder = '自定义边界（可交叉组合），输入后回车确认';
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing && input.value.trim()) chooseBoundary(input.value.trim());
  });
  box.appendChild(input);
  actions.appendChild(box);
}

function chooseBoundary(choice) {
  state.choice = choice;
  setStatus(0, '完成 · 边界已确认', 'done');
  const sec = sections[0];
  if (sec) sec.card.querySelector('.actions').innerHTML = '';
  runStep(1);
}

/* ================================================================
 * 八、Step 5 从业者拷问（聊天模式）
 * ================================================================ */

function showStep5Entry() {
  const sec = ensureCard(5);
  setStatus(5, '可选 · 未开始', 'idle');
  const actions = sec.card.querySelector('.actions');
  actions.innerHTML = '';
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'btn primary';
  b.textContent = '进入从业者拷问';
  b.onclick = startChat;
  actions.appendChild(b);
  sec.card.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function startChat() {
  const sec = sections[5];
  if (!sec) return;
  state.chatRound = 0;
  state.chatBusy = false;
  state.chatDone = false;
  sec.card.querySelector('.actions').innerHTML = '';
  const row = sec.card.querySelector('.chat-input-row');
  row.hidden = false;
  const input = sec.card.querySelector('.chat-input');
  input.disabled = false;
  input.placeholder = '第 1 / 15 轮：回答从业者的问题…';
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing && !state.chatBusy && !state.chatDone) {
      const v = input.value.trim();
      if (v) { input.value = ''; sendChat(v); }
    }
  });

  setStatus(5, '第 1 / 15 轮 · 生成中…', 'running');
  const preLen = state.session.length;
  state.session.push({ role: 'user', content: STEP_PROMPTS[5]() });
  const ok = await chatStream(preLen);
  if (ok) {
    setStatus(5, '第 1 / 15 轮 · 等待你回答', 'idle');
    input.focus();
  }
}

async function sendChat(text) {
  if (state.chatBusy || state.chatDone) return;
  state.chatBusy = true;
  const sec = sections[5];
  if (!sec) { state.chatBusy = false; return; }
  const snapRaw = sec.rawText;
  sec.rawText += '\n\n' + text.split('\n').map((l) => '> **你：**' + l).join('\n') + '\n\n';
  scheduleRender(5);
  const preLen = state.session.length;
  state.session.push({ role: 'user', content: text });
  setStatus(5, '第 ' + (state.chatRound + 1) + ' / 15 轮 · 生成中…', 'running');

  const ok = await chatStream(preLen);
  if (ok) {
    state.chatRound++;
    if (state.chatRound >= 15) { await triggerDiagnosis(); return; }
    setStatus(5, '第 ' + (state.chatRound + 1) + ' / 15 轮 · 等待你回答', 'idle');
    const input = sec.card.querySelector('.chat-input');
    input.placeholder = '第 ' + (state.chatRound + 1) + ' / 15 轮：回答从业者的问题…';
    input.focus();
  } else {
    sec.rawText = snapRaw; /* 失败回滚本轮渲染文本 */
    scheduleRender(5);
  }
  state.chatBusy = false;
}

/* 发送当前 session 并流式渲染到 Step5 卡片；失败时把会话截断回 preLen */
async function chatStream(preLen) {
  const gen = state.gen;
  const sec = sections[5];
  if (!sec) return false;
  const ac = new AbortController();
  currentAbort = ac;
  setStopEnabled(true);

  let blocks = null;
  let stopReason = null;
  try {
    for (let cont = 0; cont <= MAX_PAUSE_CONT; cont++) {
      const snap = sec.rawText;
      const res = await sendMessages({
        messages: state.session,
        signal: ac.signal,
        onText: (t) => { sec.rawText += t; scheduleRender(5); },
        onToolStart: () => { sec.toolCount++; setStatus(5, '检索中…（第 ' + sec.toolCount + ' 次）', 'running'); },
        onToolEnd: () => { setStatus(5, '生成中…', 'running'); },
        onUsage: (u) => { state.tokens.in += u.input; state.tokens.out += u.output; updateTokens(); },
        onStopReason: (r) => { stopReason = r; },
        onRewind: () => { sec.rawText = snap; scheduleRender(5); },
        onNotice: (msg) => toast(msg)
      });
      if (gen !== state.gen) return false;
      blocks = res.blocks;
      stopReason = res.stopReason;
      if (stopReason === 'pause_turn' && cont < MAX_PAUSE_CONT) {
        state.session.push({ role: 'assistant', content: blocks });
        continue;
      }
      break;
    }
  } catch (e) {
    if (gen !== state.gen) return false;
    if (currentAbort === ac) currentAbort = null;
    setStopEnabled(false);
    state.session.length = preLen;
    setStatus(5, isAbort(e) ? '已停止' : '出错：' + e.message, 'error');
    return false;
  }
  if (gen !== state.gen) return false;
  if (currentAbort === ac) currentAbort = null;
  setStopEnabled(false);

  if (stopReason === 'refusal') { state.session.length = preLen; setStatus(5, '被安全分类器拒绝', 'error'); return false; }
  if (stopReason === 'pause_turn') { state.session.length = preLen; setStatus(5, '检索续传超过 10 次', 'error'); return false; }

  state.session.push({ role: 'assistant', content: blocks });
  return true;
}

async function triggerDiagnosis() {
  const sec = sections[5];
  if (!sec) return;
  const input = sec.card.querySelector('.chat-input');
  input.disabled = true;
  setStatus(5, '15 轮完成 · 生成诊断中…', 'running');
  const msg = '现在请跳出角色，给出诊断：\n1. 这份报告里哪几栏其实是空的，只是看起来被填满了；\n2. 我哪几处用词暴露了我是外行（原句 + 内行会怎么说）；\n3. 如果我只能再补 3 块知识，应该补哪 3 块。';
  const preLen = state.session.length;
  state.session.push({ role: 'user', content: msg });
  const ok = await chatStream(preLen);
  if (ok) {
    state.chatDone = true;
    state.chatBusy = false;
    setStatus(5, '拷问完成 · 共 ' + state.chatRound + ' 轮', 'done');
    input.placeholder = '拷问已结束';
  } else {
    state.chatBusy = false;
    input.disabled = false;
  }
}

/* ================================================================
 * 九、导出 / 顶栏事件 / 设置面板 / 初始化
 * ================================================================ */

function exportMd() {
  const parts = ['# ' + (state.industry || '行业') + ' · 行业分析报告', ''];
  parts.push('> 生成时间：' + new Date().toLocaleString('zh-CN'));
  if (state.choice) parts.push('> 选定边界：' + state.choice);
  parts.push('');
  let any = false;
  for (const n of [0, 1, 2, 3, 4, 5]) {
    const sec = sections[n];
    if (!sec || !sec.rawText.trim()) continue;
    any = true;
    parts.push('## ' + STEP_META[n].title, '', sec.rawText.trim(), '');
  }
  if (!any) { toast('还没有可导出的内容'); return; }
  const md = parts.join('\n');
  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const fname = (state.industry || '行业').replace(/[\\/:*?"<>|]/g, '') + '-行业分析报告.md';
  a.download = fname;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

$('btnStart').addEventListener('click', startAnalysis);
industryInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) startAnalysis(); });

$('btnStop').addEventListener('click', () => {
  if (currentAbort) { currentAbort.abort(); currentAbort = null; }
});

$('btnExport').addEventListener('click', exportMd);

/* ---- 设置面板 ---- */

/* 根据面板当前值（未保存时也能预览）推断生效协议 */
function formProtocol() {
  const p = $('setProtocol').value;
  if (p !== 'auto') return p;
  return detectProtocol($('setBase').value);
}
function refreshProtocolUI() {
  const proto = formProtocol();
  $('setProtocolNote').textContent = proto === 'openai'
    ? '当前按 OpenAI 兼容协议请求：' + openaiUrl($('setBase').value || '') + ' + Bearer；无服务端检索，max_tokens 上限 8192。'
    : '当前按 Anthropic Messages 协议请求：' + messagesUrl($('setBase').value || '') + ' + anthropic-version；官方地址自动带 CORS 与 fallbacks 头。';
  $('setWeb').disabled = proto === 'openai';
  $('setWebNote').hidden = proto !== 'openai';
}

function openSettings() {
  $('setBase').value = settings.base;
  $('setKey').value = settings.key;
  $('setModel').value = settings.model;
  $('setAuth').value = settings.auth;
  $('setProtocol').value = settings.protocol;
  $('setWeb').checked = !!settings.web;
  $('setMax').value = settings.maxTokens;
  $('testResult').hidden = true;
  refreshProtocolUI();
  $('settingsOverlay').hidden = false;
}
function closeSettings() { $('settingsOverlay').hidden = true; }

$('btnSettings').addEventListener('click', openSettings);
$('setBase').addEventListener('input', refreshProtocolUI);
$('setProtocol').addEventListener('change', refreshProtocolUI);
$('setSave').addEventListener('click', () => {
  settings.base = cleanBase($('setBase').value) || DEFAULT_SETTINGS.base;
  settings.key = $('setKey').value.trim();
  settings.model = $('setModel').value.trim() || DEFAULT_SETTINGS.model;
  settings.auth = $('setAuth').value;
  settings.protocol = $('setProtocol').value;
  settings.web = $('setWeb').checked;
  settings.maxTokens = Math.max(1, parseInt($('setMax').value, 10) || 64000);
  saveSettings();
  closeSettings();
  toast('设置已保存（Key 仅存本机）');
});
$('setCancel').addEventListener('click', closeSettings);

/* ---- 测试连接：最小请求，按当前协议把端点返回内容分类展示（不跑流水线） ---- */
async function testConnection() {
  const box = $('testResult');
  box.hidden = false;
  box.textContent = '测试中…';
  const s = {
    base: cleanBase($('setBase').value) || DEFAULT_SETTINGS.base,
    key: $('setKey').value.trim(),
    model: $('setModel').value.trim() || DEFAULT_SETTINGS.model,
    auth: $('setAuth').value,
  };
  const proto = formProtocol();
  const official = isOfficial(s.base);
  let url, headers, body;
  if (proto === 'openai') {
    url = openaiUrl(s.base);
    headers = Object.assign({ 'content-type': 'application/json' }, buildAuth(s, false));
    body = { model: s.model, max_tokens: 16, stream: true, messages: [{ role: 'user', content: 'ping' }] };
  } else {
    url = messagesUrl(s.base);
    headers = { 'content-type': 'application/json', 'anthropic-version': '2023-06-01' };
    const mode = s.auth || 'auto';
    if (mode === 'x-api-key' || (mode === 'auto' && official)) headers['x-api-key'] = s.key;
    if (mode === 'bearer' || (mode === 'auto' && !official)) headers['Authorization'] = 'Bearer ' + s.key;
    if (official) {
      headers['anthropic-dangerous-direct-browser-access'] = 'true';
      headers['anthropic-beta'] = 'server-side-fallback-2026-07-01';
    }
    body = { model: s.model, max_tokens: 16, stream: true, messages: [{ role: 'user', content: 'ping' }], system: [{ type: 'text', text: '回复 ok' }] };
  }
  try {
    const resp = await fetch(url, { method: 'POST', headers: headers, body: JSON.stringify(body) });
    const ct = resp.headers.get('content-type') || '';
    if (!resp.ok) {
      const txt = await resp.text().catch(() => '');
      box.textContent = '✗ HTTP ' + resp.status + '（' + ct + '）：' + String(txt).slice(0, 300);
      return;
    }
    const reader = resp.body.getReader();
    const chunks = [];
    let total = 0;
    while (total < 1500) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      total += value.length;
    }
    try { await reader.cancel(); } catch (e) { /* ignore */ }
    const text = new TextDecoder().decode(concatBytes(chunks));
    const trimmed = text.replace(/\s+/g, ' ').trim().slice(0, 300);
    const label = proto === 'openai' ? 'OpenAI 兼容' : 'Anthropic';
    const isSSE = proto === 'openai'
      ? /"choices"|"delta"|\[DONE\]|chat\.completion\.chunk/m.test(text)
      : /message_start|content_block_start|^data:/m.test(text);
    if (isSSE) {
      box.textContent = '✓ 端点正常：收到 ' + label + ' 流式事件（content-type ' + ct + '）。开头：' + trimmed;
    } else if (/^\s*</.test(text)) {
      box.textContent = '✗ 该地址返回的是网页（HTML，content-type ' + ct + '）而非 API。请改填网关的 API 接口地址。开头：' + trimmed;
    } else {
      box.textContent = '⚠ 收到非流式/未知格式响应（content-type ' + ct + '）。开头：' + trimmed;
    }
  } catch (e) {
    box.textContent = '✗ 请求失败：' + (e && e.message ? e.message : e) + '（可能是地址错误 / 网络 / CORS 问题）';
  }
}

$('btnTest').addEventListener('click', testConnection);

/* ---- 初始化 ---- */
updateTokens();
if (!settings.key) openSettings(); /* 首次无 Key 自动展开设置面板 */
